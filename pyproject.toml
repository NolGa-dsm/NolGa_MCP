[project]
name = "nolga-mcp"
version = "0.1.0"
description = "FastMCP server for nolga"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.3.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]