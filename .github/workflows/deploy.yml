name: Build and Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: nolga-mcp-prod-deploy
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: sungjujjang/nolga-mcp-prod
  INFRA_REPOSITORY: sungjujjang/sungju-infra-applications
  INFRA_VALUES_FILE: apps/nolga-mcp-prod/values.yaml

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-infra:
    name: Update infra image tag
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPOSITORY }}
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Update image tag
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          set -euo pipefail
          file="infra/${INFRA_VALUES_FILE}"
          sed -i -E "0,/^([[:space:]]*tag:[[:space:]]*).*/s//\1\"${TAG}\"/" "$file"
          echo "--- ${INFRA_VALUES_FILE} ---"
          cat "$file"

      - name: Commit and push
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          set -euo pipefail
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${INFRA_VALUES_FILE}"
          if git diff --cached --quiet; then
            echo "No tag change to commit."
            exit 0
          fi
          git commit -m "chore(nolga-mcp-prod): update image tag to ${TAG}"
          git push origin HEAD:main
